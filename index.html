```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Quiz</title>

    <!-- CONNECT CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>⚽ Football Quiz</h1>

            <p class="subtitle">
                100 Hard Football Questions
            </p>

            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <div id="quiz">

                <div id="question"></div>

                <div id="options" class="options"></div>

                <div class="controls">

                    <div id="score">
                        Score: 0
                    </div>

                    <button id="next-btn">
                        Next Question
                    </button>

                </div>

            </div>

            <div id="result">

                <h2>🏆 Quiz Finished!</h2>

                <p id="final-score"></p>

                <button id="restart-btn">
                    Play Again
                </button>

            </div>

        </div>

    </div>

    <!-- CONNECT JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
